<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>閲覧用 ツール + 多タブ最適化（取得据え置き／表示件数可変／TXT分割出力／文字数表示／参加者CSV修正）</title>
  <style>
    :root { --header-shadow: 0 2px 6px rgba(0,0,0,.08); }

    /* ===== Layout ===== */
    header {
      position: fixed; inset: 0 0 auto 0; z-index: 10;
      background: #fff; box-shadow: var(--header-shadow);
      will-change: contents; contain: layout paint;
    }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      padding: 8px;
    }
    .toolbar input[type="text"]{ padding: 4px 6px; }
    .toolbar input[type="button"]{ padding: 6px 10px; }

    /* ===== Tab bar: 1-line horizontal scroll chips ===== */
    #tabbar_wrap {
      border-top: 1px solid #eee; border-bottom: 1px solid #eee;
      padding: 6px 8px;
    }
    #html_selector {
      display: block;
      height: 40px;           /* 1行固定 */
      overflow-x: auto;       /* 横スクロール */
      overflow-y: hidden;
      white-space: nowrap;    /* 折り返しなし */
      -webkit-overflow-scrolling: touch;
    }
    #html_selector input[type="radio"]{ display: none; }
    #html_selector label{
      display: inline-block;
      margin-right: 8px; padding: 6px 10px;
      border: 1px solid #ddd; border-radius: 999px;
      background: #f7f7f7; color: #333; font-size: 13px;
      cursor: pointer; user-select: none;
    }
    #html_selector input[type="radio"]:checked + label{
      border-color: #4096ff; color: #0a66ff; background: #eef4ff;
      font-weight: 600;
    }

    /* ===== Multi-select (collapsed by default) ===== */
    details#multi_tabs {
      border-bottom: 1px solid #eee;
      padding: 6px 8px;
    }
    details#multi_tabs > summary {
      cursor: pointer; list-style: none; user-select: none;
      font-weight: 600;
    }
    details#multi_tabs > summary::-webkit-details-marker { display: none; }

    /* 軽量化: flex計算をやめてクリック時の再計算を減らす */
    #multi_tab_selector{
      margin-top: 6px;
      max-height: 64px;
      overflow: auto;
      display: block;
      border: 1px solid #ddd; padding: 6px 8px; border-radius: 6px;
      background: #fafafa;
    }
    #multi_tab_selector > span { display: inline-block; margin: 4px 10px 4px 0; }

    /* ===== Content ===== */
    #html{
      padding-top: 200px; /* 初期値（JSで自動調整） */
      content-visibility: auto;
      contain-intrinsic-size: 1px 2000px;
    }

    /* ===== Message blocks ===== */
    .numbered-item { display: flex; align-items: start; }
    .number { width: auto; text-align: right; margin-right: 6px; user-select: none; }
    .numbered-item p { margin: 0 0 6px 0; }

    .tab-pane { min-height: 1px; }
  </style>
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script>
    // ===== State & helpers =====
    var request = new XMLHttpRequest();
    var message_json = [];
    var tab_list = {};
    var tab_order = [];
    var current_room_id = '';
    var current_display_messages = [];

    // 全件と表示用を分離（UIで表示件数を可変。既定は制限なし）
    var ALL_MESSAGES = [];            // 取得した全メッセージ（保存/書き出しはこちらを使用）
    var channelMetaAll = null;       // 全件ベースのチャンネルメタ（複数タブUI用）

    const RET = '\n', CRLF = '\r\n';
    const $ = jQuery;

    function htmlspecialchars(str){
      return (str + '')
        .replace(/&/g,'&amp;').replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function removespecialchars(str){
      return (str + '')
        .replace(/&/g,'removeamp').replace(/"/g,'removequot')
        .replace(/'/g,'remove039').replace(/</g,'removelt')
        .replace(/>/g,'removegt').replace(/ /g,'removespace').replace(/\//g,'removeslash');
    }
    function filename_safe(str){ return (str + '').replace(/[\\/:*?"<>|]/g,'_'); }
    function get_property(obj, props){
      for (const p of props){ if (obj && (p in obj)) obj = obj[p]; else return null; }
      return obj;
    }
    function get_url(room_id, pageToken='', pageSize=300){
      // ★ 取得ロジックは元のまま（orderBy等を入れない）
      const base = 'https://firestore.googleapis.com/v1/projects/ccfolia-160aa/databases/(default)/documents/rooms/';
      return base + room_id + '/messages/?pageSize=' + pageSize + (pageToken ? '&pageToken=' + pageToken : '');
    }
    function get_current_tab(){ return $('[name="html_selector"]:radio:checked').val(); }
    function get_tab_dom_id(tab){ return '#__tab__' + tab; }

    // ===== Header height -> content padding auto adjust (rAF間引き) =====
    let __padRaf = null;
    function adjustContentPadding(){
      if (__padRaf) cancelAnimationFrame(__padRaf);
      __padRaf = requestAnimationFrame(()=>{
        const h = document.querySelector('header').offsetHeight || 0;
        document.getElementById('html').style.paddingTop = (h + 12) + 'px';
      });
    }
    window.addEventListener('resize', adjustContentPadding, {passive:true});

    // ===== ロール結果 抽出ユーティリティ（既知パス + 深さ上限DFS） =====
    function normalizeRollString(s){
      if (!s) return '';
      return String(s).replace(/\r?\n/g, ' ').replace(/\s+/g, ' ').trim();
    }
    function extractRollResultRaw(message){
      // 既知の早道
      let v = get_property(message, ['fields','extend','mapValue','fields','roll','mapValue','fields','result','stringValue'])
           || get_property(message, ['extend','mapValue','fields','roll','mapValue','fields','result','stringValue'])
           || get_property(message, ['fields','extend','mapValue','fields','result','stringValue']);
      if (typeof v === 'string' && v) return v;

      // 深さ上限6のDFS
      const extend = get_property(message, ['fields','extend']);
      if (!extend || typeof extend !== 'object') return '';
      const stack = [[extend, 0, '']]; // [node, depth, parentKey]
      while (stack.length){
        const [node, depth, parentKey] = stack.pop();
        if (!node || depth > 6) continue;
        for (const k in node){
          const val = node[k];
          if (k === 'stringValue' && parentKey === 'result' && typeof val === 'string') return val;
          if (k === 'mapValue' && val && val.fields) stack.push([val.fields, depth+1, parentKey]);
          else if (k === 'arrayValue' && val && Array.isArray(val.values)) val.values.forEach(it => stack.push([it, depth+1, parentKey]));
          else if (val && typeof val === 'object') stack.push([val, depth+1, k]);
        }
      }
      return '';
    }
    function extractRollResultHTML(message){
      const norm = normalizeRollString(extractRollResultRaw(message));
      return norm ? htmlspecialchars(norm) : '';
    }
    function extractRollResultPlain(message){
      return normalizeRollString(extractRollResultRaw(message));
    }

    // ===== 秘匿タグ =====
    function buildChannelMeta(display_messages){
      const meta = new Map();
      display_messages.forEach(m=>{
        if (!m || !m.fields) return;
        const cid = removespecialchars(m.fields.channel.stringValue);
        const name = m.fields.channelName.stringValue;
        const id = get_property(m, ['fields','from','stringValue']);
        if (!meta.has(cid)){
          meta.set(cid, { originalName: name, ids: new Set(), isSecret: /^秘匿/.test(name), labelName: name });
        }
        if (id) meta.get(cid).ids.add(id);
      });
      let secretCounter = 0;
      meta.forEach(v=>{
        if (v.isSecret){
          secretCounter++;
          const shortIds = Array.from(v.ids).sort().slice(0,3).map(x => (x+'').substring(0,5));
          v.labelName = '秘匿#' + secretCounter + (shortIds.length ? (' [' + shortIds.join('+') + ']') : '');
        }
      });
      return meta;
    }

    // ===== Multi-tab checkbox（全チャンネルでUI生成） =====
    function rebuildMultiTabSelector(){
      const $wrap = $('#multi_tab_selector').empty();

      // 表示中タブのチャンネル + 全件メタのチャンネル をユニオン
      const ids = new Set();
      tab_order.forEach(id=>{ if (id !== 'all') ids.add(id); });
      if (channelMetaAll) channelMetaAll.forEach((_, k)=> ids.add(k));

      // 「全件(all)」は書き出し対象のチャンネルIDではないので外す
      Array.from(ids).forEach(id=>{
        const label = (tab_list[id]) || (channelMetaAll?.get(id)?.labelName) || id;
        const cbId = 'multi_' + id;
        const $cb = $('<input>', {type:'checkbox', id: cbId, value:id});
        const $lbl = $('<label>', {'for':cbId}).text(' ' + label);
        $wrap.append($('<span>').append($cb).append($lbl));
      });
    }

    // ===== 行テンプレ & チャンク描画 =====
    function rowHTML(m, labelOrNull){
      const color = htmlspecialchars(m.fields.color.stringValue || '#000');
      const num = m.message_num;
      const name = htmlspecialchars(get_property(m, ['fields','name','stringValue']) || '');
      const id5 = htmlspecialchars((get_property(m, ['fields','from','stringValue']) || '').substring(0,5));
      let body = htmlspecialchars(m.fields.text.stringValue || '');
      const roll = extractRollResultHTML(m);
      if (roll) body += ' ' + roll;
      body = body.split(/\r?\n/).join('<br>\n      ');

      const head = labelOrNull ? `<span>${htmlspecialchars(labelOrNull)}</span> :` : '';
      return (
`  <div class="numbered-item" style="color:${color};">
    <div class="number">${num}:</div>
    <p>
      ${head}
      <span>${name} [${id5}]</span> :
      <span style="color:#000000">
        ${body}
      </span>
    </p>
  </div>
`);
    }

    function renderInChunks(getChunkHTML, container, total, chunk=500){
      container.innerHTML = '';
      let rendered = 0;
      function step(){
        const end = Math.min(rendered + chunk, total);
        let buf = '';
        for (let i = rendered; i < end; i++) buf += getChunkHTML(i);
        container.insertAdjacentHTML('beforeend', buf);
        rendered = end;
        if (rendered < total) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    // ===== 文字数カウンタ（TXTと同一行生成でカウント） =====
    function buildTxtLineForCount(m, tabId, labelResolver){
      const num  = m.message_num;
      const name = get_property(m, ['fields','name','stringValue']) || '';
      const id5  = (get_property(m, ['fields','from','stringValue']) || '').substring(0,5);

      const chId = removespecialchars(get_property(m, ['fields','channel','stringValue']) || '');
      const channelLabel = (tabId === 'all')
        ? ( (typeof labelResolver === 'function' ? labelResolver(chId) : null) || get_property(m, ['fields','channelName','stringValue']) || chId )
        : null;

      let body = get_property(m, ['fields','text','stringValue']) || '';
      body = body.split(/\r?\n/).join(CRLF + '      ');
      const roll = extractRollResultPlain(m);
      if (roll) body += (body ? ' ' : '') + roll;

      const head = (tabId === 'all') ? `[${channelLabel}] : ` : '';
      const line = `${num}: ${head}${name} [${id5}] : ${body}`;
      return line + CRLF; // TXT保存はCRLFで結合するため、ここでも含めて数える
    }

    function countCharsLikeTxt(msgs, tabId, labelResolver){
      if (!Array.isArray(msgs)) return 0;
      let total = 0;
      for (const m of msgs){
        if (!m?.fields) continue;
        if (tabId && tabId !== 'all'){
          const chId = removespecialchars(get_property(m, ['fields','channel','stringValue']) || '');
          if (chId !== tabId) continue;
        }
        const line = buildTxtLineForCount(m, tabId || 'all', labelResolver);
        total += Array.from(line).length; // Unicodeセーフ
      }
      return total;
    }

    function formatNum(n){ try { return n.toLocaleString(); } catch(e){ return String(n); } }

    function updateCharCounters(){
      const curTab = get_current_tab() || 'all';

      // ラベル解決（allは全件メタ、表示中はtab_list優先でフォールバック）
      const labelFromAll = (chId)=> (channelMetaAll?.get(chId)?.labelName) || chId;
      const labelFromDisplay = (chId)=> (tab_list[chId]) || (channelMetaAll?.get(chId)?.labelName) || chId;

      // 全体：ALL_MESSAGESを"all"規則（[ラベル]付き）で
      const all = countCharsLikeTxt(ALL_MESSAGES, 'all', labelFromAll);

      // 表示中：current_display_messagesを現在タブ規則で
      const vis = countCharsLikeTxt(current_display_messages, curTab, labelFromDisplay);

      // 現在のタブ：current_display_messagesから当該タブのみ
      const tabChars = countCharsLikeTxt(current_display_messages, curTab, labelFromDisplay);

      $('#char_count_all').text('全体文字数: ' + formatNum(all));
      $('#char_count_view').text(' / 表示中: ' + formatNum(vis));
      $('#char_count_tab').text(' / 現在のタブ: ' + formatNum(tabChars));
    }

    // ===== Render（取得は据え置き。描画だけ最適化・UIで件数可変） =====
    function getRenderCapFromUI(){
      const v = Number($('#max_render').val());
      if (Number.isFinite(v) && v > 0) return Math.floor(v);
      return Infinity; // 空欄または無効値なら制限なし
    }

    function process_messages(messages){
      // 昇順 + 通し番号
      messages.sort((a,b)=> a.createTime<b.createTime?-1:a.createTime>b.createTime?1:0);
      messages.forEach((m,i,arr)=> arr[i].message_num = i + 1);

      // ▼全件を保持（保存/書き出しは ALL_MESSAGES を使う）
      ALL_MESSAGES = messages;

      // 範囲は元の仕様通り。未指定なら UIの最大描画件数を適用（空欄=無制限）
      const start = $('#text_start').val(), end = $('#text_end').val();
      let display;
      if (!isNaN(start) && start !== '' && !isNaN(end) && end !== ''){
        display = messages.slice(Math.max(0, Number(start)-1), Math.max(0, Number(end)));
      } else if (!isNaN(start) && start !== ''){
        display = messages.slice(-Number(start));
      } else {
        const cap = getRenderCapFromUI(); // Infinity なら全件
        display = (cap === Infinity) ? messages.slice() : messages.slice(-cap);
      }
      current_display_messages = display;

      // メタ情報（表示用と全件用）
      const channelMeta = buildChannelMeta(display);
      channelMetaAll = buildChannelMeta(ALL_MESSAGES);

      // タブUI初期化
      tab_list = {}; tab_order = [];
      $('#html').empty();
      $('#html_selector').empty();

      // “全件”タブだけ即描画、他は遅延（初回選択時）
      tab_list['all'] = '全件'; tab_order.push('all');
      const allPane = $('<div>', {id:'__tab__all', class:'tab-pane'})[0];
      document.getElementById('html').appendChild(allPane);
      $('#html_selector')
        .append($('<input>', {type:'radio', id:'tab_radio_all', name:'html_selector', value:'all', checked:true}))
        .append($('<label>', {'for':'tab_radio_all'}).text('全件'));

      const panes = {'all': allPane};
      display.forEach(message=>{
        const channel_id = removespecialchars(message.fields.channel.stringValue);
        const label = (channelMeta.get(channel_id)?.labelName) ?? message.fields.channelName.stringValue;
        if (!(channel_id in tab_list)){
          tab_list[channel_id] = label; tab_order.push(channel_id);
          const pane = $('<div>', {id:'__tab__'+channel_id, class:'tab-pane', style:'display:none;'}).get(0);
          document.getElementById('html').appendChild(pane);
          panes[channel_id] = pane;
          $('#html_selector')
            .append($('<input>', {type:'radio', id:'tab_radio_'+channel_id, name:'html_selector', value:channel_id}))
            .append($('<label>', {'for':'tab_radio_'+channel_id}).text(label));
        }
      });

      // “全件”をチャンク描画
      const labels = {}; tab_order.forEach(id=>{ if (id!=='all') labels[id] = tab_list[id]; });
      const allGet = (i)=>{ const m = display[i]; const chId = removespecialchars(m.fields.channel.stringValue);
                            return rowHTML(m, labels[chId] || chId); };
      renderInChunks(allGet, allPane, display.length, 500);

      rebuildMultiTabSelector();
      adjustContentPadding();
      updateCharCounters(); // ← 総/表示中/タブの文字数を更新

      // 各タブは初回だけ描画して以降は表示切替だけ
      const rendered = new Set(['all']);
      $('[name="html_selector"]:radio').off('change').on('change', function(){
        const cur = get_current_tab();
        for (const t in tab_list){ $(get_tab_dom_id(t)).toggle(t === cur); }
        if (!rendered.has(cur) && cur !== 'all'){
          const pane = panes[cur];
          const idxList = [];
          for (let i=0;i<display.length;i++){
            const chId = removespecialchars(display[i].fields.channel.stringValue);
            if (chId === cur) idxList.push(i);
          }
          renderInChunks((k)=> rowHTML(display[idxList[k]], null), pane, idxList.length, 500);
          rendered.add(cur);
        }
        updateCharCounters(); // ← タブ切替時にも更新
      });
    }

    // ===== HTTP callbacks（据え置き） =====
    function http_request_callback(){
      const data = this.response;
      if (data && data.documents){
        for (const d of data.documents) message_json.push(d);
        $('#log_number').text(message_json.length + '件');
      }
      if (data && data.nextPageToken){
        this.open('GET', get_url(current_room_id, data.nextPageToken, 300), true);
        this.responseType = 'json'; this.send();
      } else {
        $('#progress').text('HTML生成中...');
        setTimeout(()=> process_messages(message_json), 1);
        this.removeEventListener('load', http_request_callback);
      }
    }

    // ===== CSV (UTF-8 BOM) =====
    // 参加者CSV（全件・text空でもカウント・CSVエスケープ）
    function buildParticipantsCSV(msgs){
      const map = new Map();
      (msgs || ALL_MESSAGES || []).forEach(m=>{
        const id   = get_property(m, ['fields','from','stringValue']);
        const name = get_property(m, ['fields','name','stringValue']);
        if (!id || !name) return; // どちらか欠けてたら除外
        if (!map.has(id)) map.set(id, new Set());
        map.get(id).add(name);    // textが空でも発言として扱う
      });
      const rows = ['id,names'];
      Array.from(map.keys()).sort().forEach(id=>{
        const names = Array.from(map.get(id)).sort()
          .map(n => String(n).replace(/"/g,'""'))  // CSVエスケープ
          .join(', ');
        rows.push(`${id},"${names}"`);
      });
      return rows.join(CRLF) + CRLF;
    }

    // ===== TXT helpers（DOMクローン無し・データ駆動） =====
    function currentTabToPlainText(){
      const tabId = get_current_tab() || 'all';
      const lines = [];
      const set = tabId === 'all' ? null : tabId;
      current_display_messages.forEach(m=>{
        if (!m?.fields) return;
        const chId = removespecialchars(get_property(m, ['fields','channel','stringValue']) || '');
        if (set && chId !== set) return;

        const channelLabel = tabId==='all' ? (tab_list[chId] || get_property(m, ['fields','channelName','stringValue']) || chId) : null;
        const num = m.message_num;
        const name = get_property(m, ['fields','name','stringValue']) || '';
        const id5 = (get_property(m, ['fields','from','stringValue']) || '').substring(0,5);

        let body = get_property(m, ['fields','text','stringValue']) || '';
        body = body.split(/\r?\n/).join(CRLF + '      ');
        const roll = extractRollResultPlain(m);
        if (roll) body += ' ' + roll;

        const head = tabId==='all' ? '[' + (channelLabel || chId) + '] : ' : '';
        lines.push(`${num}: ${head}${name} [${id5}] : ${body}`);
      });
      return lines.join(CRLF) + CRLF;
    }

    // 選択タブTXTは全件から生成（UIは軽いまま出力はフル）
    function selectedTabsToPlainTextChrono(){
      const selected = $('#multi_tab_selector input[type=checkbox]:checked').map(function(){ return this.value; }).get();
      if (selected.length === 0){ alert('タブを1つ以上選択してください。'); return null; }
      if (selected.includes('all') && selected.length > 1){ alert('「全件」は単独で選択してください。'); return null; }

      const set = new Set(selected);
      const lines = [];
      ALL_MESSAGES.forEach(m=>{
        if (!m?.fields) return;
        const chId = removespecialchars(get_property(m, ['fields','channel','stringValue']) || '');
        if (!set.has(chId)) return;

        const channelLabel = (channelMetaAll?.get(chId)?.labelName) || get_property(m, ['fields','channelName','stringValue']) || chId;
        const num = m.message_num;
        const name = get_property(m, ['fields','name','stringValue']) || '';
        const id5 = (get_property(m, ['fields','from','stringValue']) || '').substring(0,5);

        let body = get_property(m, ['fields','text','stringValue']) || '';
        body = body.split(/\r?\n/).join(CRLF + '      ');
        const roll = extractRollResultPlain(m);
        if (roll) body += ' ' + roll;

        lines.push(`${num}: [${channelLabel}] : ${name} [${id5}] : ${body}`);
      });
      return lines.join(CRLF) + CRLF;
    }

    // ===== TXT 分割出力ユーティリティ =====
    function parseTxtMaxChars(){
      const v = Number($('#txt_max_chars').val());
      if (Number.isFinite(v) && v > 0) return Math.floor(v);
      return Infinity; // 空欄または無効値なら制限なし
    }
    function downloadTextWithSplit(baseName, fullText, maxChars){
      if (!fullText) { alert('出力対象がありません。'); return; }
      const limit = maxChars;
      const bom = '\uFEFF';
      if (limit === Infinity){
        const blob = new Blob([bom + fullText], {type:'text/plain;charset=utf-8'});
        $('<a>', {href: URL.createObjectURL(blob), download: baseName + '.txt', target: '_blank'})[0].click();
        return;
      }
      // Unicodeセーフ分割（サロゲート対策）
      const cps = Array.from(fullText);
      const total = cps.length;
      const parts = Math.ceil(total / limit);
      const width = String(parts).length;
      for (let i = 0; i < parts; i++){
        const chunk = cps.slice(i*limit, (i+1)*limit).join('');
        const blob = new Blob([bom + chunk], {type:'text/plain;charset=utf-8'});
        const fn = `${baseName}_part${String(i+1).padStart(width,'0')}.txt`;
        $('<a>', {href: URL.createObjectURL(blob), download: fn, target: '_blank'})[0].click();
      }
    }

    // ===== init =====
    $(function(){
      // fetch（取得方式は元のまま）
      $('#get_log').on('click', function(){
        if (isNaN(Number($('#text_start').val())) && $('#text_start').val() !== ''){ alert('開始位置or表示件数の値が無効です'); return; }
        if (isNaN(Number($('#text_end').val())) && $('#text_end').val() !== ''){ alert('終了位置の値が無効です'); return; }
        $('#progress').text('取得中...');
        current_room_id = $('#room_id').val();
        document.title = current_room_id + ' CCFolia ログ取得ツール';
        message_json.splice(0);
        try { request.abort(); } catch(e) {}
        request = new XMLHttpRequest();
        request.open('GET', get_url(current_room_id), true);
        request.responseType = 'json'; request.send();
        request.addEventListener('load', http_request_callback);
      });

      // 表示更新（UIの最大描画件数を変えたときに使う）
      $('#refresh_view').on('click', function(){
        if (!ALL_MESSAGES.length){
          alert('先にログを取得してください。'); return;
        }
        $('#progress').text('再描画中...');
        setTimeout(()=>{ process_messages(ALL_MESSAGES.slice()); $('#progress').text(''); }, 1);
      });

      // Save HTML（未描画タブはデータから生成）
      $('#save_html').on('click', function(){
        const tab = get_current_tab() || 'all';
        let main = '';
        if (tab === 'all'){
          const dom = document.querySelector('#__tab__all');
          main = dom && dom.innerHTML ? dom.innerHTML
               : current_display_messages.map(m=>{
                   const chId = removespecialchars(get_property(m, ['fields','channel','stringValue']) || '');
                   const label = tab_list[chId] || get_property(m, ['fields','channelName','stringValue']) || chId;
                   return rowHTML(m, label);
                 }).join('');
        } else {
          main = current_display_messages
                  .filter(m=> removespecialchars(get_property(m, ['fields','channel','stringValue']) || '')===tab)
                  .map(m=> rowHTML(m, null)).join('');
        }
        const header = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>チャットログ</title></head><body>' + RET;
        const footer = RET + '</body></html>';
        const doc = (header + '<div>' + main + '</div>' + footer).split(/\r?\n/).join(CRLF);
        const blob = new Blob([doc], {type:'text/html'});
        const fn = 'log_' + filename_safe(current_room_id) + '_' + filename_safe(tab_list[tab] || tab) + '.html';
        $('<a>', {href: URL.createObjectURL(blob), download: fn, target:'_blank'})[0].click();
      });

      // Save JSON（据え置き）
      $('#save_json').on('click', function(){
        const blob = new Blob([JSON.stringify(message_json, null, '    ')], {type:'application/json'});
        $('<a>', {href: URL.createObjectURL(blob), download: 'log_' + filename_safe(current_room_id) + '.json', target:'_blank'})[0].click();
      });

      // Save CSV（全件・text空もカウント）
      $('#save_participants_csv').on('click', function(){
        if (!ALL_MESSAGES.length){ alert('先にログを取得してください。'); return; }
        const bom = '\uFEFF';
        const csv = buildParticipantsCSV(ALL_MESSAGES);
        const blob = new Blob([bom + csv], {type:'text/csv;charset=utf-8'});
        const fn = 'participants_' + filename_safe(current_room_id) + '_all.csv';
        $('<a>', {href: URL.createObjectURL(blob), download: fn, target:'_blank'})[0].click();
      });

      // Save TXT（現在のタブ = 画面表示分）＋分割出力
      $('#save_txt').on('click', function(){
        const text = currentTabToPlainText();
        const base = 'log_' + filename_safe(current_room_id) + '_' + filename_safe(tab_list[get_current_tab()||'all'] || 'all');
        const maxChars = parseTxtMaxChars();
        downloadTextWithSplit(base, text, maxChars);
      });

      // Save TXT (selected tabs, chronological) — 全件から生成＋分割出力
      $('#save_txt_multi').on('click', function(){
        const txt = selectedTabsToPlainTextChrono();
        if (txt == null) return;
        const base = 'log_' + filename_safe(current_room_id) + '_selected-tabs_chrono';
        const maxChars = parseTxtMaxChars();
        downloadTextWithSplit(base, txt, maxChars);
      });

      // toggle tab bar (hide/show)
      $('#toggle_tabs').on('click', function(){
        const $wrap = $('#tabbar_wrap');
        $wrap.toggle();
        this.value = $wrap.is(':visible') ? 'タブ欄を隠す' : 'タブ欄を表示';
        adjustContentPadding();
      });

      // details開閉で高さ再計算
      document.getElementById('multi_tabs').addEventListener('toggle', adjustContentPadding);

      // 初回パディング調整
      adjustContentPadding();
    });
  </script>
</head>
<body>
  <header>
    <div class="toolbar">
      <input type="text" id="room_id" placeholder="ルームIDを入力">
      <input type="text" id="text_start" placeholder="開始位置or表示件数">
      <span>-</span>
      <input type="text" id="text_end" placeholder="終了位置">
      <!-- 表示件数（空欄=制限なし） -->
      <input type="text" id="max_render" placeholder="最大描画件数（空欄=制限なし）" style="width:200px">
      <!-- TXT分割出力（空欄=制限なし） -->
      <input type="text" id="txt_max_chars" placeholder="TXT出力最大文字数（空欄=制限なし）" style="width:230px">
      <input type="button" id="get_log" value="ログを取得">
      <input type="button" id="refresh_view" value="表示更新">
      <input type="button" id="save_html" value="保存(HTML)">
      <input type="button" id="save_json" value="保存(JSON)">
      <input type="button" id="save_participants_csv" value="参加者CSV">
      <input type="button" id="save_txt" value="保存(TXT)">
      <input type="button" id="toggle_tabs" value="タブ欄を隠す">
      <span id="progress" style="margin-left:8px;"></span>
      <span id="log_number" style="margin-left:8px;"></span>
      <!-- 文字数表示 -->
      <span id="char_count_all" style="margin-left:8px; font-weight:600;"></span>
      <span id="char_count_view" style="margin-left:4px; color:#666;"></span>
      <span id="char_count_tab"  style="margin-left:4px; color:#666;"></span>
    </div>

    <!-- 横スクロール1行タブバー -->
    <div id="tabbar_wrap">
      <form id="html_selector"></form>
    </div>

    <!-- 複数タブ選択（デフォルト閉じ） -->
    <details id="multi_tabs">
      <summary>選択タブをTXT保存（時系列）</summary>
      <div id="multi_tab_selector"></div>
      <div style="margin-top:8px;">
        <input type="button" id="save_txt_multi" value="選択タブをTXT保存（時系列）">
      </div>
    </details>
  </header>

  <div id="html"></div>

  <div style="margin: 12px 8px;">
    <br>更新点: 参加者CSVは<strong>全件</strong>から作成し、text空の発言も含めます。文字数表示は「全体 / 表示中 / 現在タブ」。TXT分割の閾値カウントは保存行と同一ロジックに統一。
  </div>
</body>
</html>
