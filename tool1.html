<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>閲覧用 ツール + 保存/CSV</title>
    <style>
        /* スタイルは変更なし（必要なところだけ少し調整） */
        .numbered-list {
          display: flex;
          flex-wrap: wrap;
          gap: 10px;
        }
        .numbered-item {
          display: flex;
          align-items: start;
        }
        .number {
          width: auto;
          text-align: right;
          margin-right: 6px;
          user-select: none;
        }
        .numbered-item p {
            margin-top: 0;
            margin-bottom: 6px;
        }
        header {
          background: #ffffff;
          position: fixed;
          inset: 0 auto auto 0;
          width: 100%;
          padding: 8px;
          box-shadow: 0 2px 6px rgba(0,0,0,.08);
          z-index: 10;
        }
        header input[type="text"]{
          margin-right: 4px;
          padding: 4px 6px;
        }
        header input[type="button"]{
          margin-right: 4px;
          padding: 6px 10px;
        }
        #html_selector {
          height: 50px;
          overflow: auto;
          margin-top: 6px;
          display: flex;
          gap: 8px;
          align-items: center;
          flex-wrap: wrap;
        }
        #html_selector label {
          margin-right: 12px;
          cursor: pointer;
          user-select: none;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script>
        // =========================
        // 変数とヘルパー関数の定義
        // =========================
        var request = new XMLHttpRequest();
        var message_json = [];                 // 取得した全メッセージ
        var tab_list = {};                     // タブID -> 表示名
        var current_room_id = '';
        var current_display_messages = [];     // 表示対象（開始/終了指定後に使用）
        const RET = '\n';
        const CRLF = '\r\n';

        // HTML特殊文字のエスケープ処理
        function htmlspecialchars(str) {
            return (str + '')
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        // 特殊文字の除去（内部処理用：タブID等）
        function removespecialchars(str) {
            return (str + '')
                .replace(/&/g, 'removeamp')
                .replace(/"/g, 'removequot')
                .replace(/'/g, 'remove039')
                .replace(/</g, 'removelt')
                .replace(/>/g, 'removegt')
                .replace(/ /g, 'removespace')
                .replace(/\//g, 'removeslash');
        }

        // ファイル名に安全な文字列へ
        function filename_safe(str) {
            return (str + '').replace(/[\\/:*?"<>|]/g, '_');
        }

        // オブジェクトからプロパティを取得する関数
        function get_property(obj, props) {
            for (const prop of props) {
                if (obj && (prop in obj)) {
                    obj = obj[prop];
                } else {
                    return null;
                }
            }
            return obj;
        }

        // APIのURL生成
        function get_url(room_id, pageToken = '', pageSize = 300) {
            const base_url = 'https://firestore.googleapis.com/v1/projects/ccfolia-160aa/databases/(default)/documents/rooms/';
            return base_url + room_id + '/messages/' + '?pageSize=' + pageSize + '&pageToken=' + pageToken;
        }

        // 現在選択されているタブを取得
        function get_current_tab() {
            return $('[name="html_selector"]:radio:checked').val();
        }

        // タブのDOM IDを取得
        function get_tab_dom_id(tab_name) {
            return '#__tab__' + tab_name;
        }

        // HTMLエンコード（DOM -> outerHTML）
        function convertToHTML(input) {
            return jQuery('<div>').append(input.clone(true)).html();
        }

        // =========================
        // メッセージ処理と描画
        // =========================
        function process_messages(messages) {
            // 時系列順にソート
            messages.sort(function(a, b) {
                if (a.createTime < b.createTime) return -1;
                if (a.createTime > b.createTime) return 1;
                return 0;
            });

            // レス番号付与
            messages.forEach(function(message, index, arr) {
                arr[index].message_num = index + 1;
            });

            // 表示範囲の設定
            var start = $('#text_start').val();
            var end = $('#text_end').val();
            var display_messages;

            if (!isNaN(start) && start !== '' && !isNaN(end) && end !== '') {
                // 範囲指定: start〜end（1始まりインデックス）
                display_messages = messages.slice(Math.max(0, Number(start) - 1), Math.max(0, Number(end)));
            } else if (!isNaN(start) && start !== '') {
                // 最新 n 件
                display_messages = messages.slice(-Number(start));
            } else {
                // 未指定なら全件
                display_messages = messages.slice();
            }
            current_display_messages = display_messages; // CSV用に保持

            tab_list = {};
            var tab_content = {};

            $('#html').empty();
            $('#html_selector').empty();

            // 「全件」タブの追加
            tab_list['all'] = '全件';
            tab_content['all'] = $('<div></div>', {'id': '__tab__all'});
            $('#html_selector')
                .append($('<input>', {type: 'radio', id: 'tab_radio_all', name: 'html_selector', value: 'all', checked: true}))
                .append($('<label>', {'for': 'tab_radio_all'}).text('全件'));

            // 各メッセージを処理
            display_messages.forEach(function(message) {
                const channel_name = removespecialchars(message.fields.channel.stringValue);
                const channel_display_name = message.fields.channelName.stringValue;

                // チャンネルごとのタブを作成
                if (!(channel_name in tab_list)) {
                    tab_list[channel_name] = channel_display_name;
                    tab_content[channel_name] = $('<div></div>', {'id': '__tab__' + channel_name});
                    $('#html_selector')
                        .append($('<input>', {type: 'radio', id: 'tab_radio_' + channel_name, name: 'html_selector', value: channel_name, checked: false}))
                        .append($('<label>', {'for': 'tab_radio_' + channel_name}).text(channel_display_name));
                }

                if (message.fields.text.stringValue != '') {
                    // ダイスロール結果
                    var roll_result = get_property(message.fields, ['extend', 'mapValue', 'fields', 'roll', 'mapValue', 'fields', 'result', 'stringValue']);

                    // テキスト整形 & エスケープ
                    var message_text = htmlspecialchars(message.fields.text.stringValue);

                    // ロール結果があれば末尾に付与
                    if (roll_result) {
                        message_text += ' ' + htmlspecialchars(roll_result);
                    }

                    // 改行 -> <br>
                    message_text = message_text.split(/\r?\n/).join('<br>\n      ');

                    // ------- 全件タブ用 -------
                    var string = RET;
                    string += '  <div class="numbered-item" style="color:' + message.fields.color.stringValue + ';">\n';
                    string += '    <div class="number">' + message.message_num + ':</div>\n';
                    string += '    <p>\n';
                    string += '      <span>' + channel_display_name + '</span> :\n';
                    string += '      <span>' + htmlspecialchars(message.fields.name.stringValue) + ' [' + htmlspecialchars(message.fields.from.stringValue).substring(0, 5) + ']</span> :\n';
                    string += '      <span style="color:#000000">\n';
                    string += '        ' + message_text + '\n';
                    string += '      </span>\n';
                    string += '    </p>\n';
                    string += '  </div>\n';
                    $(tab_content['all']).append(string);

                    // ------- チャンネル別タブ用 -------
                    string = RET;
                    string += '  <div class="numbered-item" style="color:' + message.fields.color.stringValue + ';">\n';
                    string += '    <div class="number">' + message.message_num + ':</div>\n';
                    string += '    <p>\n';
                    string += '      <span>' + htmlspecialchars(message.fields.name.stringValue) + ' [' + htmlspecialchars(message.fields.from.stringValue).substring(0, 5) + ']</span> :\n';
                    string += '      <span style="color:#000000">\n';
                    string += '        ' + message_text + '\n';
                    string += '      </span>\n';
                    string += '    </p>\n';
                    string += '  </div>\n';
                    $(tab_content[channel_name]).append(string);
                }
            });

            // タブコンテンツをHTMLに追加
            for (const tab_name in tab_content) {
                $('#html').append(tab_content[tab_name]);
                if (tab_name != 'all') {
                    $('#__tab__' + tab_name).hide();
                }
            }

            // タブ切り替え
            $('[name="html_selector"]:radio').change(function() {
                const current_tab = get_current_tab();
                for (const tab_name in tab_list) {
                    if (tab_name == current_tab) {
                        $(get_tab_dom_id(tab_name)).show();
                    } else {
                        $(get_tab_dom_id(tab_name)).hide();
                    }
                }
            });

            $('#progress').text('完了');
        }

        // =========================
        // HTTP リクエストのコールバック
        // =========================
        function http_request_callback() {
            const response_data = this.response;
            if (response_data && response_data.documents) {
                for (const document of response_data.documents) {
                    message_json.push(document);
                }
                $('#log_number').text(message_json.length + '件');
            }

            if (response_data && response_data.nextPageToken) {
                // 次ページ取得
                this.open('GET', get_url(current_room_id, response_data.nextPageToken), true);
                this.responseType = 'json';
                this.send();
            } else {
                // 取得完了 -> 描画
                $('#progress').text('HTML生成中...');
                setTimeout(() => {
                    process_messages(message_json);
                }, 1);
                this.removeEventListener('load', http_request_callback);
            }
        }

        // =========================
        // CSV生成（参加者一覧）
        // =========================
        function buildParticipantsCSV(displayMessages) {
            // ID -> Set(names)
            const map = new Map();

            (displayMessages || []).forEach(function(m) {
                // テキストのないシステム行は除外（画面表示と揃える）
                if (!m || !m.fields || !m.fields.text || m.fields.text.stringValue === '') return;

                const id = get_property(m, ['fields','from','stringValue']);
                const name = get_property(m, ['fields','name','stringValue']);

                if (!id || !name) return;

                if (!map.has(id)) {
                    map.set(id, new Set());
                }
                map.get(id).add(name);
            });

            // CSV文字列作成
            // ヘッダ
            let rows = ['id,names'];
            // ID昇順で出力
            const ids = Array.from(map.keys()).sort();
            ids.forEach(id => {
                const names = Array.from(map.get(id)).sort();
                // namesはカンマ区切り、CSVの2列目はダブルクォートで囲う
                const line = id + ',"' + names.join(', ') + '"';
                rows.push(line);
            });

            // CRLFで結合（Excel互換）
            return rows.join(CRLF) + CRLF;
        }

        // =========================
        // 初期化とボタンイベント
        // =========================
        $(function() {
            // ボタン：ログを取得
            $('#get_log').click(function(event) {
                // 入力値のバリデーション
                if (isNaN(Number($('#text_start').val())) && $('#text_start').val() != '') {
                    window.alert('開始位置or表示件数の値が無効です');
                    return;
                }
                if (isNaN(Number($('#text_end').val())) && $('#text_end').val() != '') {
                    window.alert('終了位置の値が無効です');
                    return;
                }

                $('#progress').text('取得中...');
                current_room_id = $('#room_id').val();
                document.title = current_room_id + ' ' + 'CCFolia ログ取得ツール';

                // メッセージ配列をクリア
                message_json.splice(0);

                // APIリクエスト
                request.open('GET', get_url(current_room_id), true);
                request.responseType = 'json';
                request.send();
                request.addEventListener('load', http_request_callback);
            });

            // ボタン：保存(HTML) - 現在のタブのみ
            $('#save_html').click(function(e) {
                const currentTab = get_current_tab() || 'all';
                const header = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>チャットログ</title></head><body>' + RET;
                const main = convertToHTML($(get_tab_dom_id(currentTab)));
                const footer = RET + '</body></html>';
                let doc = header + main + footer;

                // LF => CRLF
                doc = doc.split(/\r?\n/).join(CRLF);

                const blob = new Blob([doc], {"type": "text/html"});
                const filename = 'log_' + filename_safe(current_room_id) + '_' + filename_safe(tab_list[currentTab] || currentTab) + '.html';
                $("<a></a>", {
                    href: window.URL.createObjectURL(blob),
                    download: filename,
                    target: "_blank"
                })[0].click();
            });

            // ボタン：保存(JSON) - 全件
            $('#save_json').click(function(e) {
                const doc = JSON.stringify(message_json, null, "    ");
                const blob = new Blob([doc], {"type": "application/json"});
                const filename = 'log_' + filename_safe(current_room_id) + '.json';
                $("<a></a>", {
                    href: window.URL.createObjectURL(blob),
                    download: filename,
                    target: "_blank"
                })[0].click();
            });

            // ボタン：参加者CSV - 表示対象のみ
            $('#save_participants_csv').click(function(e) {
                if (!current_display_messages.length) {
                    window.alert('先にログを取得してください（開始/終了を指定している場合は、その範囲が対象になります）。');
                    return;
                }
                const csv = buildParticipantsCSV(current_display_messages);
                const blob = new Blob([csv], {"type": "text/csv"});
                const currentTab = get_current_tab() || 'all';
                const filename = 'participants_' + filename_safe(current_room_id) + '_' + filename_safe(tab_list[currentTab] || currentTab) + '.csv';
                $("<a></a>", {
                    href: window.URL.createObjectURL(blob),
                    download: filename,
                    target: "_blank"
                })[0].click();
            });
        });
    </script>
</head>

<body>
    <header>
        <div style="display:flex; flex-wrap:wrap; gap:6px; align-items:center;">
            <input type="text" id="room_id" placeholder="ルームIDを入力">
            <input type="text" id="text_start" placeholder="開始位置or表示件数">
            <span>-</span>
            <input type="text" id="text_end" placeholder="終了位置">
            <input type="button" id="get_log" value="ログを取得">
            <input type="button" id="save_html" value="保存(HTML)">
            <input type="button" id="save_json" value="保存(JSON)">
            <input type="button" id="save_participants_csv" value="参加者CSV">
            <span id="progress" style="margin-left:8px;"></span>
            <span id="log_number" style="margin-left:8px;"></span>
        </div>
        <form id="html_selector"></form>
    </header>
    
    <div id="html" style="padding-top: 120px;"></div>

    <div style="margin-top: 12px;">
        <br>左枠に卓ID、右に表示数を入れてください
        <br>0で全件表示されますが、大量のデータの場合は処理に時間がかかる可能性があります
        <br>ver1.12: 保存(HTML/JSON)・参加者CSVを追加。開始/終了指定の範囲でCSV化、ID→使用名をユニーク化
        <br>開始位置のみ記述すれば最新n件、両方記述でその範囲のログを取得します
    </div>
</body>
</html>
