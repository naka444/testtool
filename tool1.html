<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>閲覧用 ツール + 保存/CSV + 秘匿タグ + TXT(複数/時系列)</title>
    <style>
        .numbered-item { display: flex; align-items: start; }
        .number { width: auto; text-align: right; margin-right: 6px; user-select: none; }
        .numbered-item p { margin-top: 0; margin-bottom: 6px; }
        header {
          background: #ffffff; position: fixed; inset: 0 auto auto 0; width: 100%;
          padding: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.08); z-index: 10;
        }
        header input[type="text"]{ margin-right: 4px; padding: 4px 6px; }
        header input[type="button"]{ margin-right: 4px; padding: 6px 10px; }
        #html_selector { height: 50px; overflow: auto; margin-top: 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        #html_selector label { margin-right: 12px; cursor: pointer; user-select: none; }
        #multi_tab_selector_wrap { margin-top: 6px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        #multi_tab_selector {
          max-height: 56px; overflow: auto; display: flex; gap: 10px; flex-wrap: wrap;
          border: 1px solid #ddd; padding: 6px 8px; border-radius: 6px;
        }
        #html { padding-top: 160px; }
    </style>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script>
        // =========================
        // 変数とヘルパー
        // =========================
        var request = new XMLHttpRequest();
        var message_json = [];                 // 取得した全メッセージ
        var tab_list = {};                     // タブID -> 表示ラベル
        var tab_order = [];                    // タブ表示順
        var current_room_id = '';
        var current_display_messages = [];     // 表示対象（開始/終了指定後の範囲）
        const RET = '\n';
        const CRLF = '\r\n';

        function htmlspecialchars(str) {
            return (str + '')
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;')
                .replace(/</g, 'removelt').replace(/>/g, 'removegt')  // avoid accidental tags in label preview
                .replace(/removelt/g,'&lt;').replace(/removegt/g,'&gt;');
        }
        function removespecialchars(str) {
            return (str + '')
                .replace(/&/g, 'removeamp')
                .replace(/"/g, 'removequot')
                .replace(/'/g, 'remove039')
                .replace(/</g, 'removelt')
                .replace(/>/g, 'removegt')
                .replace(/ /g, 'removespace')
                .replace(/\//g, 'removeslash');
        }
        function filename_safe(str) { return (str + '').replace(/[\\/:*?"<>|]/g, '_'); }

        function get_property(obj, props) {
            for (const prop of props) {
                if (obj && (prop in obj)) { obj = obj[prop]; } else { return null; }
            }
            return obj;
        }
        function get_url(room_id, pageToken = '', pageSize = 300) {
            const base_url = 'https://firestore.googleapis.com/v1/projects/ccfolia-160aa/databases/(default)/documents/rooms/';
            return base_url + room_id + '/messages/' + '?pageSize=' + pageSize + '&pageToken=' + pageToken;
        }
        function get_current_tab() { return $('[name="html_selector"]:radio:checked').val(); }
        function get_tab_dom_id(tab_name) { return '#__tab__' + tab_name; }
        function convertToHTML(input) { return jQuery('<div>').append(input.clone(true)).html(); }

        // =========================
        // 秘匿タグ生成用：チャンネルメタ
        // =========================
        function buildChannelMeta(display_messages) {
            const metaMap = new Map();
            display_messages.forEach(m => {
                if (!m || !m.fields) return;
                const channel_id = removespecialchars(m.fields.channel.stringValue);
                const originalName = m.fields.channelName.stringValue;
                const id = get_property(m, ['fields','from','stringValue']);
                if (!metaMap.has(channel_id)) {
                    metaMap.set(channel_id, {
                        originalName, ids: new Set(), isSecret: /^秘匿/.test(originalName), labelName: originalName
                    });
                }
                if (id) metaMap.get(channel_id).ids.add(id);
            });

            let secretCounter = 0;
            metaMap.forEach(meta => {
                if (meta.isSecret) {
                    secretCounter++;
                    const shortIds = Array.from(meta.ids).sort().slice(0,3).map(x => (x+'').substring(0,5));
                    meta.labelName = '秘匿#' + secretCounter + (shortIds.length ? (' [' + shortIds.join('+') + ']') : '');
                } else {
                    meta.labelName = meta.originalName;
                }
            });
            return metaMap;
        }

        // =========================
        // タブ複数選択UIの再構築
        // =========================
        function rebuildMultiTabSelector() {
            const $wrap = $('#multi_tab_selector');
            $wrap.empty();
            tab_order.forEach(tabId => {
                const label = tab_list[tabId] || tabId;
                const cbId = 'multi_' + tabId;
                const $cb = $('<input>', {type:'checkbox', id: cbId, value: tabId});
                const $lbl = $('<label>', {'for': cbId}).text(' ' + label);
                const $box = $('<span>').append($cb).append($lbl);
                $wrap.append($box);
            });
        }

        // =========================
        // メッセージ処理と描画
        // =========================
        function process_messages(messages) {
            messages.sort((a,b)=> a.createTime<b.createTime?-1:a.createTime>b.createTime?1:0);
            messages.forEach((m,i,arr)=> arr[i].message_num = i+1);

            var start = $('#text_start').val();
            var end = $('#text_end').val();
            var display_messages;
            if (!isNaN(start) && start !== '' && !isNaN(end) && end !== '') {
                display_messages = messages.slice(Math.max(0, Number(start)-1), Math.max(0, Number(end)));
            } else if (!isNaN(start) && start !== '') {
                display_messages = messages.slice(-Number(start));
            } else {
                display_messages = messages.slice();
            }
            current_display_messages = display_messages;

            const channelMeta = buildChannelMeta(display_messages);

            tab_list = {};
            tab_order = [];
            var tab_content = {};
            $('#html').empty();
            $('#html_selector').empty();

            // 全件タブ
            tab_list['all'] = '全件';
            tab_order.push('all');
            tab_content['all'] = $('<div></div>', {id:'__tab__all'});
            $('#html_selector')
              .append($('<input>', {type:'radio', id:'tab_radio_all', name:'html_selector', value:'all', checked:true}))
              .append($('<label>', {'for':'tab_radio_all'}).text('全件'));

            // メッセージ描画
            display_messages.forEach(function(message){
                const channel_id = removespecialchars(message.fields.channel.stringValue);
                const cm = channelMeta.get(channel_id);
                const channel_label_name = cm ? cm.labelName : message.fields.channelName.stringValue;

                if (!(channel_id in tab_list)) {
                    tab_list[channel_id] = channel_label_name;
                    tab_order.push(channel_id);
                    tab_content[channel_id] = $('<div></div>', {id:'__tab__'+channel_id});
                    $('#html_selector')
                      .append($('<input>', {type:'radio', id:'tab_radio_'+channel_id, name:'html_selector', value:channel_id}))
                      .append($('<label>', {'for':'tab_radio_'+channel_id}).text(channel_label_name));
                }

                if (message.fields.text.stringValue != '') {
                    var roll_result = get_property(message.fields, ['extend','mapValue','fields','roll','mapValue','fields','result','stringValue']);
                    var message_text = htmlspecialchars(message.fields.text.stringValue);
                    if (roll_result) { message_text += ' ' + htmlspecialchars(roll_result); }
                    message_text = message_text.split(/\r?\n/).join('<br>\n      ');

                    // 全件
                    var s = RET;
                    s += '  <div class="numbered-item" style="color:' + message.fields.color.stringValue + ';">\n';
                    s += '    <div class="number">' + message.message_num + ':</div>\n';
                    s += '    <p>\n';
                    s += '      <span>' + htmlspecialchars(channel_label_name) + '</span> :\n';
                    s += '      <span>' + htmlspecialchars(message.fields.name.stringValue) + ' [' + htmlspecialchars(message.fields.from.stringValue).substring(0,5) + ']</span> :\n';
                    s += '      <span style="color:#000000">\n';
                    s += '        ' + message_text + '\n';
                    s += '      </span>\n';
                    s += '    </p>\n';
                    s += '  </div>\n';
                    $(tab_content['all']).append(s);

                    // チャンネル別
                    s = RET;
                    s += '  <div class="numbered-item" style="color:' + message.fields.color.stringValue + ';">\n';
                    s += '    <div class="number">' + message.message_num + ':</div>\n';
                    s += '    <p>\n';
                    s += '      <span>' + htmlspecialchars(message.fields.name.stringValue) + ' [' + htmlspecialchars(message.fields.from.stringValue).substring(0,5) + ']</span> :\n';
                    s += '      <span style="color:#000000">\n';
                    s += '        ' + message_text + '\n';
                    s += '      </span>\n';
                    s += '    </p>\n';
                    s += '  </div>\n';
                    $(tab_content[channel_id]).append(s);
                }
            });

            for (const tab_name in tab_content) {
                $('#html').append(tab_content[tab_name]);
                if (tab_name !== 'all') $('#__tab__'+tab_name).hide();
            }

            // 複数選択チェックボックスを再構築
            rebuildMultiTabSelector();

            // タブ切替
            $('[name="html_selector"]:radio').off('change').on('change', function() {
                const cur = get_current_tab();
                for (const t in tab_list) { $(get_tab_dom_id(t)).toggle(t===cur); }
            });

            $('#progress').text('完了');
        }

        // =========================
        // HTTPコールバック
        // =========================
        function http_request_callback() {
            const response_data = this.response;
            if (response_data && response_data.documents) {
                for (const document of response_data.documents) { message_json.push(document); }
                $('#log_number').text(message_json.length + '件');
            }
            if (response_data && response_data.nextPageToken) {
                this.open('GET', get_url(current_room_id, response_data.nextPageToken), true);
                this.responseType = 'json';
                this.send();
            } else {
                $('#progress').text('HTML生成中...');
                setTimeout(()=>{ process_messages(message_json); }, 1);
                this.removeEventListener('load', http_request_callback);
            }
        }

        // =========================
        // 参加者CSV（UTF-8 BOM付き）
        // =========================
        function buildParticipantsCSV(displayMessages) {
            const map = new Map(); // id -> Set(names)
            (displayMessages || []).forEach(function(m){
                if (!m || !m.fields || !m.fields.text || m.fields.text.stringValue === '') return;
                const id = get_property(m, ['fields','from','stringValue']);
                const name = get_property(m, ['fields','name','stringValue']);
                if (!id || !name) return;
                if (!map.has(id)) map.set(id, new Set());
                map.get(id).add(name);
            });
            let rows = ['id,names'];
            const ids = Array.from(map.keys()).sort();
            ids.forEach(id => {
                const names = Array.from(map.get(id)).sort();
                rows.push(id + ',"' + names.join(', ') + '"');
            });
            return rows.join(CRLF) + CRLF;
        }

        // =========================
        // TXT（プレーンテキスト）生成
        // =========================
        function tabToPlainText(tabId) {
            const $clone = $(get_tab_dom_id(tabId)).clone(true);
            $clone.find('br').replaceWith('\n');
            let text = $clone.text();
            return text.replace(/\r?\n/g, CRLF);
        }
        function currentTabToPlainText() {
            const currentTab = get_current_tab() || 'all';
            return tabToPlainText(currentTab);
        }

        // ★ 選択タブを「時系列」で1ファイルにまとめる
        function selectedTabsToPlainTextChrono() {
            const selected = $('#multi_tab_selector input[type=checkbox]:checked').map(function(){ return this.value; }).get();
            if (selected.length === 0) { alert('タブを1つ以上選択してください。'); return null; }
            if (selected.includes('all') && selected.length > 1) {
                alert('「全件」は単独で選択してください。');
                return null;
            }

            // 選択タブに属するメッセージのみ抽出（current_display_messagesは時系列ソート済み）
            const selectedSet = new Set(selected);
            const lines = [];

            current_display_messages.forEach(m => {
                if (!m || !m.fields) return;
                if (!m.fields.text || m.fields.text.stringValue === '') return;

                const chId = removespecialchars(m.fields.channel.stringValue);
                if (!selectedSet.has(chId)) return;

                const channelLabel = tab_list[chId] || m.fields.channelName.stringValue;
                const num = m.message_num;
                const name = get_property(m, ['fields','name','stringValue']) || '';
                const id = (get_property(m, ['fields','from','stringValue']) || '').substring(0,5);

                // 本文（改行維持・インデント） + ダイス結果
                let body = m.fields.text.stringValue || '';
                body = body.split(/\r?\n/).join(CRLF + '      ');
                const roll = get_property(m, ['extend','mapValue','fields','roll','mapValue','fields','result','stringValue']);
                if (roll) body += ' ' + roll;

                const line = `${num}: [${channelLabel}] : ${name} [${id}] : ${body}`;
                lines.push(line);
            });

            return lines.join(CRLF) + CRLF;
        }

        // =========================
        // 初期化 & ボタン
        // =========================
        $(function() {
            // 取得
            $('#get_log').click(function(){
                if (isNaN(Number($('#text_start').val())) && $('#text_start').val() != '') { alert('開始位置or表示件数の値が無効です'); return; }
                if (isNaN(Number($('#text_end').val()))   && $('#text_end').val()   != '') { alert('終了位置の値が無効です'); return; }

                $('#progress').text('取得中...');
                current_room_id = $('#room_id').val();
                document.title = current_room_id + ' ' + 'CCFolia ログ取得ツール';
                message_json.splice(0);

                request.open('GET', get_url(current_room_id), true);
                request.responseType = 'json';
                request.send();
                request.addEventListener('load', http_request_callback);
            });

            // 保存(HTML) - 現タブ
            $('#save_html').click(function(){
                const currentTab = get_current_tab() || 'all';
                const header = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>チャットログ</title></head><body>' + RET;
                const main = convertToHTML($(get_tab_dom_id(currentTab)));
                const footer = RET + '</body></html>';
                let doc = (header + main + footer).split(/\r?\n/).join(CRLF);
                const blob = new Blob([doc], {"type": "text/html"});
                const filename = 'log_' + filename_safe(current_room_id) + '_' + filename_safe(tab_list[currentTab] || currentTab) + '.html';
                $("<a></a>", { href: URL.createObjectURL(blob), download: filename, target: "_blank" })[0].click();
            });

            // 保存(JSON) - 全件
            $('#save_json').click(function(){
                const doc = JSON.stringify(message_json, null, "    ");
                const blob = new Blob([doc], {"type": "application/json"});
                const filename = 'log_' + filename_safe(current_room_id) + '.json';
                $("<a></a>", { href: URL.createObjectURL(blob), download: filename, target: "_blank" })[0].click();
            });

            // 参加者CSV - 表示対象のみ（UTF-8 BOM付）
            $('#save_participants_csv').click(function(){
                if (!current_display_messages.length) { alert('先にログを取得してください。'); return; }
                const csv = buildParticipantsCSV(current_display_messages);
                const bom = '\uFEFF';
                const blob = new Blob([bom + csv], {"type": "text/csv;charset=utf-8"});
                const currentTab = get_current_tab() || 'all';
                const filename = 'participants_' + filename_safe(current_room_id) + '_' + filename_safe(tab_list[currentTab] || currentTab) + '.csv';
                $("<a></a>", { href: URL.createObjectURL(blob), download: filename, target: "_blank" })[0].click();
            });

            // 保存(TXT) - 現タブ（UTF-8 BOM付）
            $('#save_txt').click(function(){
                const text = currentTabToPlainText();
                const bom = '\uFEFF';
                const blob = new Blob([bom + text], {"type": "text/plain;charset=utf-8"});
                const currentTab = get_current_tab() || 'all';
                const filename = 'log_' + filename_safe(current_room_id) + '_' + filename_safe(tab_list[currentTab] || currentTab) + '.txt';
                $("<a></a>", { href: URL.createObjectURL(blob), download: filename, target: "_blank" })[0].click();
            });

            // 保存(TXT) - 選択タブまとめ（UTF-8 BOM付、時系列）
            $('#save_txt_multi').click(function(){
                const text = selectedTabsToPlainTextChrono();
                if (text == null) return;
                const bom = '\uFEFF';
                const blob = new Blob([bom + text], {"type": "text/plain;charset=utf-8"});
                const filename = 'log_' + filename_safe(current_room_id) + '_selected-tabs_chrono.txt';
                $("<a></a>", { href: URL.createObjectURL(blob), download: filename, target: "_blank" })[0].click();
            });
        });
    </script>
</head>

<body>
    <header>
        <div style="display:flex; flex-wrap:wrap; gap:6px; align-items:center;">
            <input type="text" id="room_id" placeholder="ルームIDを入力">
            <input type="text" id="text_start" placeholder="開始位置or表示件数">
            <span>-</span>
            <input type="text" id="text_end" placeholder="終了位置">
            <input type="button" id="get_log" value="ログを取得">
            <input type="button" id="save_html" value="保存(HTML)">
            <input type="button" id="save_json" value="保存(JSON)">
            <input type="button" id="save_participants_csv" value="参加者CSV">
            <input type="button" id="save_txt" value="保存(TXT)">
            <span id="progress" style="margin-left:8px;"></span>
            <span id="log_number" style="margin-left:8px;"></span>
        </div>
        <form id="html_selector"></form>

        <!-- 複数タブ選択 -> TXT出力（時系列） -->
        <div id="multi_tab_selector_wrap">
            <div>タブ選択（複数可 / 「全件」は単独で）:</div>
            <div id="multi_tab_selector"></div>
            <input type="button" id="save_txt_multi" value="選択タブをTXT保存（時系列）">
        </div>
    </header>
    
    <div id="html"></div>

    <div style="margin-top: 12px;">
        <br>左枠に卓ID、右に表示数を入れてください
        <br>0で全件表示されますが、大量のデータの場合は処理に時間がかかる可能性があります
        <br>ver1.16: 複数タブTXTを**時系列でマージ**して1ファイルに保存（UTF-8 BOM）。書式は全件タブと同じ。
        <br>秘匿タブは「秘匿#N [短縮ID…]」タグで識別。CSVはUTF-8(BOM)で文字化け対策済み。
        <br>開始位置のみ記述すれば最新n件、両方記述でその範囲のログを取得します
    </div>
</body>
</html>
